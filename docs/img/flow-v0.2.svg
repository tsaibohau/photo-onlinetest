<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Microsoft JhengHei, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="960" height="400" fill="#fff"/>
<text x="20" y="32" font-size="18" font-weight="bold" fill="#312e81">階段一：拍導覽圖 → 有比例的拓撲地圖</text>
<g font-size="14" text-anchor="middle">
<rect x="20" y="50" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="87" y="78">拍導覽圖</text><text x="87" y="98" font-size="12" fill="#4b5563">透視校正、品質檢查</text>
<rect x="180" y="50" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="247" y="78">YOLO 找物件</text><text x="247" y="98" font-size="12" fill="#4b5563">攤位、出入口、比例尺</text>
<rect x="340" y="50" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="407" y="78">OCR 讀名稱</text><text x="407" y="98" font-size="12" fill="#4b5563">有字必有物件</text>
<rect x="500" y="50" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="567" y="78">走道＋比例化</text><text x="567" y="98" font-size="12" fill="#4b5563">上下左右、分段縮放</text>
<rect x="660" y="50" width="135" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="727" y="78">勾選保留</text><text x="727" y="98" font-size="12" fill="#4b5563">不滿意就自己畫</text>
<rect x="820" y="50" width="120" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="880" y="78">有比例的</text><text x="880" y="98">拓撲地圖</text>
</g>
<g stroke="#4b5563" stroke-width="2" marker-end="url(#a)">
<line x1="155" y1="82" x2="178" y2="82"/><line x1="315" y1="82" x2="338" y2="82"/><line x1="475" y1="82" x2="498" y2="82"/><line x1="635" y1="82" x2="658" y2="82"/><line x1="795" y1="82" x2="818" y2="82"/>
</g>
<text x="20" y="232" font-size="18" font-weight="bold" fill="#312e81">階段二：拍前方 → 我在哪裡、走道多寬</text>
<g font-size="14" text-anchor="middle">
<rect x="20" y="250" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="87" y="278">舉起手機拍前方</text><text x="87" y="298" font-size="12" fill="#4b5563">一倍鏡頭、保持水平</text>
<rect x="180" y="250" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="247" y="278">YOLO 找招牌、牆角</text><text x="247" y="298" font-size="12" fill="#4b5563">地面與牆的交界</text>
<rect x="340" y="250" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="407" y="278">OCR 讀編號、門牌</text><text x="407" y="298" font-size="12" fill="#4b5563">對到地圖上的物件</text>
<rect x="500" y="250" width="135" height="64" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="567" y="278">相似三角形</text><text x="567" y="298" font-size="12" fill="#4b5563">W = Hc × Δu ÷ Δv</text>
<rect x="660" y="250" width="135" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="727" y="278">我在這裡</text><text x="727" y="298" font-size="12" fill="#4b5563">吸附到走道上</text>
</g>
<g stroke="#4b5563" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="155" y1="282" x2="178" y2="282"/><line x1="315" y1="282" x2="338" y2="282"/><line x1="475" y1="282" x2="498" y2="282"/><line x1="635" y1="282" x2="658" y2="282"/>
<path d="M880,114 L880,340 L727,340 L727,316"/>
<path d="M567,250 L567,116" stroke="#d97706" stroke-dasharray="6 5"/>
</g>
<text x="575" y="175" font-size="13" fill="#b45309">量到的寬度、距離回填，比例越用越準</text>
<text x="890" y="200" font-size="13" fill="#15803d">用這份</text><text x="890" y="218" font-size="13" fill="#15803d">地圖定位</text>
<text x="20" y="385" font-size="12" fill="#6b7280">照片、辨識、定位全部在使用者的瀏覽器裡完成，照片不上傳、不進資料庫。</text>
</svg>
